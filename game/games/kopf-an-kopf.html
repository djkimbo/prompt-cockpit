<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kopf an Kopf</title>
<style>
/* Kopf an Kopf: Karten-Duell „mehr oder weniger“ mit echten, geprüften Zahlen
   zu Spielern und Vereinen. Gleiche Karte und Farben wie die anderen Spiele, eine Datei, keine Netzaufrufe
   (nur die Quellen-Links auf den Karten öffnen Seiten, wenn man sie anklickt). */
:root {
  --bg: #f2f5f3;
  --card: #ffffff;
  --ink: #17251c;
  --muted: #5b6a61;
  --line: #e1e7e3;
  --pitch: #2f8a4a;
  --pitch-2: #23703b;
  --chalk: #ffffff;
  --gold: #f2c230;
  --rot: #e5534b;
  --gruen: #2fae5b;
  --ich-hose: #1f5c34;
  --knopf-hover: #e3efe6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  margin: 0;
  font-family: var(--font);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  max-width: 560px;
  margin: 0 auto;
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 1px 3px rgba(23, 37, 28, .06), 0 10px 30px rgba(23, 37, 28, .06);
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1 { font-size: 1.9rem; line-height: 1.15; margin: 0; }
.lead { font-size: 1.08rem; line-height: 1.5; color: var(--muted); margin: 0; }

.leiste { display: flex; gap: 8px; }
.kasten {
  position: relative;
  flex: 1 1 0;
  background: var(--pitch); color: var(--chalk);
  border-radius: 12px; padding: 8px 12px;
  font-variant-numeric: tabular-nums;
}
.kasten small { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.kasten b { display: block; font-size: 1.35rem; line-height: 1.2; }
.kasten.puls { animation: puls 280ms ease-out; }
@keyframes puls { 40% { scale: 1.07; } }

.arena {
  position: relative;
  background: linear-gradient(180deg, var(--pitch), var(--pitch-2));
  border-radius: 16px;
  padding: 14px;
  min-height: 380px;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.frage {
  color: var(--chalk); text-align: center; font-weight: 800; font-size: 1.05rem;
  margin: 2px 0 12px; min-height: 1.4em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.frage .kat { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .16); margin-right: 6px; font-size: .9rem; }
.bahn { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; }
.vs {
  align-self: center;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--gold); color: #17251c; font-weight: 900; font-size: .95rem;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  z-index: 2;
  transition: background 200ms, color 200ms, scale 200ms;
}
.vs.richtig { background: var(--gruen); color: #fff; scale: 1.15; }
.vs.falsch { background: var(--rot); color: #fff; scale: 1.15; }

.karte {
  position: relative;
  background: var(--card);
  border-radius: 14px;
  padding: 0 0 12px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  overflow: hidden;
  min-height: 300px;
}
.karte .kopf { width: 100%; padding: 7px 8px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.avatar {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  margin: 14px 0 8px;
  font-weight: 900; font-size: 1.4rem; color: #fff;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15);
}
.karte .name { font-weight: 900; font-size: 1.1rem; line-height: 1.2; padding: 0 8px; overflow-wrap: break-word; hyphens: auto; }
.karte .zusatz { color: var(--muted); font-size: .85rem; margin-top: 3px; padding: 0 8px; }
.karte .wert { margin-top: auto; padding-top: 10px; font-variant-numeric: tabular-nums; }
.karte .wert b { display: block; font-size: 2rem; line-height: 1; font-weight: 900; }
.karte .wert small { color: var(--muted); font-size: .8rem; font-weight: 700; }
.karte .quelle { font-size: .7rem; color: var(--muted); margin-top: 6px; }
.karte .quelle a { color: inherit; }
.knoepfe { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; width: 100%; padding-inline: 10px; }
.wahl {
  appearance: none; border: 0; border-radius: 999px;
  padding: 11px 10px;
  font: inherit; font-weight: 900; font-size: 1rem;
  cursor: pointer; touch-action: manipulation;
  background: var(--pitch); color: #fff;
  transition: translate 120ms, background 120ms;
}
.wahl.tief { background: var(--ink); }
.wahl:hover { translate: 0 -2px; }
.wahl:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wahl kbd { font: inherit; font-size: .75rem; opacity: .65; margin-left: 6px; }

.karte.rein { animation: rein 380ms cubic-bezier(.25, 1.3, .5, 1) both; }
@keyframes rein { from { opacity: 0; translate: 40px 0; rotate: 6deg; } to { opacity: 1; translate: 0 0; rotate: 0deg; } }
.karte.rueber { animation: rueber 380ms cubic-bezier(.4, 0, .2, 1) both; }
@keyframes rueber { from { translate: var(--weg) 0; } to { translate: 0 0; } }
.karte.richtig { box-shadow: 0 0 0 4px var(--gruen), 0 6px 18px rgba(0, 0, 0, .18); }
.karte.falsch { box-shadow: 0 0 0 4px var(--rot), 0 6px 18px rgba(0, 0, 0, .18); animation: wackeln 420ms ease-in-out; }
@keyframes wackeln { 15%, 55% { translate: -7px 0; } 35%, 75% { translate: 7px 0; } }
.karte .wert.auf b { animation: auf 300ms cubic-bezier(.3, 1.6, .5, 1); }
@keyframes auf { from { scale: .6; opacity: 0; } to { scale: 1; opacity: 1; } }

.serie-flamme { position: absolute; right: 10px; top: 6px; font-size: 1.1rem; animation: flamme 900ms ease-in-out infinite alternate; }
@keyframes flamme { from { scale: 1; rotate: -6deg; } to { scale: 1.15; rotate: 6deg; } }

.ring, .funke, .konfetti, .banner { position: absolute; pointer-events: none; z-index: 6; }
.funke { left: 0; top: 0; border-radius: 50%; animation: funke var(--dauer, 700ms) cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes funke { from { transform: translate(var(--x0), var(--y0)) scale(1); opacity: 1; } to { transform: translate(var(--x1), var(--y1)) scale(.2); opacity: 0; } }
.konfetti { left: 0; top: 0; width: 7px; height: 11px; border-radius: 2px; animation: konfetti var(--dauer, 1500ms) cubic-bezier(.25, .6, .4, 1) var(--verz, 0ms) both; }
@keyframes konfetti { from { transform: translate(var(--x0), var(--y0)) rotate(0deg); opacity: 1; } 85% { opacity: 1; } to { transform: translate(var(--x1), var(--y1)) rotate(var(--dreh)); opacity: 0; } }
.banner {
  left: 50%; top: 50%; translate: -50% -50%;
  width: max-content; max-width: 88%;
  padding: 10px 18px; border-radius: 14px;
  background: var(--gold); color: #17251c;
  font-weight: 900; font-size: 1.15rem; text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  animation: banner 1300ms cubic-bezier(.3, 1.4, .5, 1) forwards;
}
@keyframes banner { 0% { scale: .5; opacity: 0; } 14% { scale: 1.08; opacity: 1; } 24% { scale: 1; } 78% { opacity: 1; translate: -50% -50%; } 100% { opacity: 0; translate: -50% -80%; } }
.plus { position: absolute; right: 10px; top: 6px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.3); pointer-events: none; animation: plus 850ms ease-out forwards; }
@keyframes plus { from { opacity: 1; translate: 0 6px; } to { opacity: 0; translate: 0 -26px; } }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(320px, calc(100% - 32px));
  padding: 18px 18px 16px;
  border-radius: 16px;
  background: rgba(12, 32, 19, .92);
  color: var(--chalk);
  text-align: center;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 8;
}
.panel[hidden] { display: none; }
.panel:not([hidden]) { animation: panelAuf 280ms cubic-bezier(.3, 1.4, .5, 1); }
@keyframes panelAuf { from { opacity: 0; transform: translate(-50%, -44%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.panel-titel { margin: 0; font-size: 1.35rem; font-weight: 800; }
.panel.neu .panel-titel { color: var(--gold); }
.panel-text { margin: 0; font-size: .95rem; font-weight: 600; line-height: 1.45; opacity: .93; }
.knopf {
  appearance: none; border: 0; border-radius: 999px;
  padding: 12px 18px;
  font: inherit; font-size: 1rem; font-weight: 800;
  background: var(--chalk); color: var(--ich-hose);
  cursor: pointer; touch-action: manipulation;
}
.knopf:hover { background: var(--knopf-hover); }
.knopf:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.regeln { margin: 0; padding-left: 1.1em; color: var(--muted); line-height: 1.55; font-size: .95rem; }

@media (max-width: 420px) {
  .karte { min-height: 270px; }
  .avatar { width: 52px; height: 52px; font-size: 1.15rem; margin-top: 10px; }
  .karte .name { font-size: .98rem; }
  .karte .wert b { font-size: 1.6rem; }
  .vs { width: 34px; height: 34px; font-size: .8rem; }
  .bahn { gap: 6px; }
  .arena { padding: 10px; }
  .wahl { font-size: .92rem; padding: 10px 6px; }
  .wahl kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .karte.rein, .karte.rueber, .karte.falsch, .karte .wert.auf b, .serie-flamme, .panel:not([hidden]), .kasten.puls { animation: none; }
  .funke, .konfetti { display: none; }
}
</style>
</head>
<body>
<style id="handy">
/* Handy-Grundlage (18.11.2026), gleich in allen Spielen: kein Doppeltipp-Zoom, kein Kontextmenü beim
   langen Drücken, kein Zurückfedern der Seite, kompaktere Karte und Spielfläche passend zur Bildschirmhöhe. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
.game, .arena, .brett, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
@media (max-width: 520px) {
  body { padding-block: 10px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .card { padding: 16px 12px; gap: 12px; border-radius: 16px; }
  h1 { font-size: 1.45rem; }
  .lead { font-size: .95rem; line-height: 1.45; }
  .regeln { font-size: .88rem; }
  .knopf, .wahl { min-height: 44px; }   /* Daumen-Mindestgröße */
  .game canvas { height: clamp(360px, calc(100svh - 190px), 480px); }
}
@media (max-height: 560px) and (orientation: landscape) {
  .lead, .regeln { display: none; }
  body { padding-block: 6px; }
  .card { padding: 10px 12px; gap: 8px; }
  h1 { font-size: 1.2rem; }
  .leiste { gap: 6px; }
  .kasten { padding: 3px 10px; display: flex; align-items: baseline; gap: 8px; }
  .kasten b { font-size: 1rem; }
  .arena { min-height: 0; padding: 8px; }
  .frage { font-size: .9rem; margin-bottom: 6px; }
  .karte { min-height: 0; padding-bottom: 8px; }
  .karte .kopf { padding: 4px 6px; }
  .avatar { width: 38px; height: 38px; font-size: .95rem; margin: 6px 0 4px; }
  .karte .wert b { font-size: 1.5rem; }
  .knoepfe { flex-direction: row; padding-top: 6px; }
  .wahl { flex: 1; padding: 8px 6px; font-size: .9rem; }
  .game canvas { height: clamp(260px, calc(100svh - 70px), 480px); }
}
</style>
<script id="handy-scroll">
// Beim Start auf dem Handy die ganze Spielfläche ins Bild holen
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('.panel .knopf, #neu, .panel button')) return;
  var g = document.querySelector('.game, .arena, .brett');
  if (!g) return;
  var r = g.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) g.scrollIntoView({ block: 'center', behavior: 'smooth' });
}, true);
</script>
<main class="card">
  <h1 id="titel">Kopf an Kopf</h1>
  <p class="lead" id="lead"></p>

  <div class="leiste">
    <div class="kasten"><small id="lblSerie"></small><b id="serie">0</b></div>
    <div class="kasten"><small id="lblBest"></small><b id="best">0</b></div>
  </div>

  <div class="arena" id="arena">
    <p class="frage" id="frage" aria-live="polite"></p>
    <div class="bahn" id="bahn">
      <div class="karte" id="links"></div>
      <div class="vs" id="vs">VS</div>
      <div class="karte" id="rechts"></div>
    </div>
    <div class="panel" id="panel" aria-live="polite">
      <p class="panel-titel" id="panelTitel" hidden></p>
      <p class="panel-text" id="panelText"></p>
      <button type="button" class="knopf" id="knopf"></button>
    </div>
  </div>

  <ul class="regeln" id="regeln"></ul>
</main>

  function initialen(name) {
    var t = name.replace(/[^\p{L}\d .-]/gu, '').split(/[\s-]+/).filter(Boolean);
    var skip = { fc: 1, sc: 1, sv: 1, vfb: 1, vfl: 1, tsv: 1, tsg: 1, bv: 1, ac: 1, as: 1, cf: 1, sl: 1, de: 1, 'the': 1 };
    var w = t.filter(function (x) { return !skip[x.toLowerCase()] && !/^\d+$/.test(x); });
    if (!w.length) w = t;
    return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[w.length - 1][0]).toUpperCase();
  }
  function farbeVon(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + h + ' 45% 38%)';
  }
  function schluessel(d) { return d.kategorie + '|' + d.name; }

  // Nächste Karte: früh in der Serie zufällig, später eher knapp am aktuellen Wert
  function naechste(kat, gegen) {
    var pool = NACH_KAT[kat].filter(function (d) {
      return d !== gegen && S.zuletzt.indexOf(schluessel(d)) < 0;
    });
    if (pool.length < 2) pool = NACH_KAT[kat].filter(function (d) { return d !== gegen; });
    if (!gegen || S.serie < 3) return zufall(pool);
    pool.sort(function (a, b) { return Math.abs(a.wert - gegen.wert) - Math.abs(b.wert - gegen.wert); });
    var anteil = Math.max(0.25, 1 - S.serie * 0.06);
    return zufall(pool.slice(0, Math.max(2, Math.ceil(pool.length * anteil))));
  }
  function merken(d) { S.zuletzt.push(schluessel(d)); if (S.zuletzt.length > 8) S.zuletzt.shift(); }

  // ── Karten zeichnen ──────────────────────────────────────────────────────
  function karte(el, d, offen) {
    var k = KAT[d.kategorie];
    el.innerHTML = '';
    el.className = 'karte';
    var kopf = document.createElement('div'); kopf.className = 'kopf'; kopf.style.background = k.farbe;
    kopf.textContent = k.icon + ' ' + kt(d.kategorie, 0);
    var av = document.createElement('div'); av.className = 'avatar'; av.style.background = farbeVon(d.name); av.textContent = initialen(d.name);
    var name = document.createElement('div'); name.className = 'name'; name.textContent = d.name;
    var zu = document.createElement('div'); zu.className = 'zusatz'; zu.textContent = d.zusatz || '';
    el.appendChild(kopf); el.appendChild(av); el.appendChild(name); el.appendChild(zu);
    if (offen) {
      el.appendChild(wertBlock(d, false));
    } else {
      var kn = document.createElement('div'); kn.className = 'knoepfe';
      kn.appendChild(wahlKnopf(kt(d.kategorie, 2), 'hoch', '→'));
      kn.appendChild(wahlKnopf(kt(d.kategorie, 3), 'tief', '←'));
      el.appendChild(kn);
    }
  }
  function wertBlock(d, animiert) {
    var k = KAT[d.kategorie];
    var w = document.createElement('div'); w.className = 'wert' + (animiert ? ' auf' : '');
    var b = document.createElement('b'); b.textContent = zahl(d.wert, k.jahr);
    var sm = document.createElement('small'); sm.textContent = kt(d.kategorie, 4);
    w.appendChild(b); w.appendChild(sm);
    if (d.quelle) {
      var q = document.createElement('div'); q.className = 'quelle';
      var a = document.createElement('a'); a.href = d.quelle; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = T.quelle;
      q.appendChild(a); w.appendChild(q);
    }
    w._b = b;   // Zahl-Element fürs Hochzählen
    return w;
  }

  function wahlKnopf(text, art, taste) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'wahl ' + art;
    b.textContent = (art === 'hoch' ? '▲ ' : '▼ ') + text;
    var k = document.createElement('kbd'); k.textContent = taste; b.appendChild(k);
    b.addEventListener('click', function () { antwort(art === 'hoch'); });
    return b;
  }

  function frageZeigen() {
    elFrage.innerHTML = '';
    var k = document.createElement('span'); k.className = 'kat'; k.textContent = KAT[S.kat].icon + ' ' + kt(S.kat, 0);
    elFrage.appendChild(k);
    elFrage.appendChild(document.createTextNode(kt(S.kat, 1)));
  }

  function anzeige() {
    elSerie.textContent = zahl(S.serie);
    elBest.textContent = zahl(Math.max(best, S.serie));
  }

  // ── Ablauf ───────────────────────────────────────────────────────────────
  function neuesThema() {
    var moeglich = KATS.filter(function (k) { return k !== S.kat; });
    S.kat = zufall(moeglich.length ? moeglich : KATS);
    S.rest = THEMA_LAENGE[0] + Math.floor(Math.random() * (THEMA_LAENGE[1] - THEMA_LAENGE[0] + 1));
    S.links = naechste(S.kat, null); merken(S.links);
    S.rechts = naechste(S.kat, S.links); merken(S.rechts);
  }

  function tafel(titel, text, knopf, neu) {
    elTitel.hidden = !titel;
    elTitel.textContent = titel || '';
    elText.textContent = text;
    elKnopf.textContent = knopf;
    elKnopf.hidden = !knopf;
    elPanel.classList.toggle('neu', !!neu);
    elPanel.hidden = false;
    try { elKnopf.focus({ preventScroll: true }); } catch (e) { /* egal */ }
  }

  function bereit() {
    S.zustand = 'bereit';
    anzeige();
    if (KATS.length === 0) { tafel('', T.keineDaten, '', false); return; }
    S.serie = 0; S.zuletzt = []; S.kat = null;
    neuesThema();
    frageZeigen();
    karte(elLinks, S.links, true);
    karte(elRechts, S.rechts, false);
    tafel('', T.bereit, T.start, false);
  }

  function start() {
    S.serie = 0; S.zuletzt = []; S.kat = null;
    var flamme = document.querySelector('.serie-flamme');
    if (flamme) flamme.remove();
    neuesThema();
    S.zustand = 'frage';
    elPanel.hidden = true;
    elVs.className = 'vs'; elVs.textContent = 'VS';
    frageZeigen();
    karte(elLinks, S.links, true);
    karte(elRechts, S.rechts, false);
    elRechts.classList.add('rein');
    anzeige();
    fokusKnopf();
  }

  function fokusKnopf() {
    var b = elRechts.querySelector('.wahl.hoch');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* egal */ }
  }

  function antwort(hoch) {
    if (S.zustand !== 'frage') return;
    S.zustand = 'aufdecken';
    var a = S.links, b = S.rechts;
    var richtig = b.wert === a.wert || (hoch ? b.wert > a.wert : b.wert < a.wert);

    // Wert aufdecken und hochzählen
    var kn = elRechts.querySelector('.knoepfe'); if (kn) kn.remove();
    var w = wertBlock(b, true);
    elRechts.appendChild(w);
    zaehlen(w._b, b.wert, KAT[b.kategorie].jahr, KAT[b.kategorie].jahr ? a.wert : 0);

    setTimeout(function () {
      elVs.className = 'vs ' + (richtig ? 'richtig' : 'falsch');
      elVs.textContent = richtig ? '✓' : '✕';
      elRechts.classList.add(richtig ? 'richtig' : 'falsch');
      if (richtig) {
        S.serie++;
        if (S.serie > best) { best = S.serie; try { localStorage.setItem(SPEICHER, String(best)); } catch (e) { /* egal */ } }
        anzeige();
        plus();
        funkenAn(elRechts, 14);
        if (T.meilenstein[S.serie]) { banner(T.meilenstein[S.serie]); konfetti(40 + S.serie * 2); }
        setTimeout(weiter, 850);
      } else {
        var neu = S.serie > 0 && S.serie >= best;
        var jahr = KAT[b.kategorie].jahr;
        var text = (jahr ? T.endeTextJahr : T.endeText).replace('{a}', b.name).replace('{w}', zahl(b.wert, jahr) + (jahr ? '' : ' ' + kt(b.kategorie, 4))).replace('{s}', zahl(S.serie));
        S.zustand = 'ende';
        if (neu) konfetti(70);
        setTimeout(function () { tafel(neu ? T.rec : T.ende, text, T.again, neu); }, 900);
      }
    }, ruhig ? 50 : 650);
  }

  function weiter() {
    S.rest--;
    var themaNeu = S.rest <= 0;
    if (themaNeu) {
      neuesThema();
      banner(T.wechsel.replace('{k}', kt(S.kat, 0)));
      frageZeigen();
      karte(elLinks, S.links, true);
      elLinks.classList.add('rein');
    } else {
      S.links = S.rechts;
      S.rechts = naechste(S.kat, S.links); merken(S.rechts);
      // rechte Karte rutscht nach links
      karte(elLinks, S.links, true);
      var abstand = elRechts.getBoundingClientRect().left - elLinks.getBoundingClientRect().left;
      elLinks.style.setProperty('--weg', abstand + 'px');
      elLinks.classList.add('rueber');
    }
    karte(elRechts, S.rechts, false);
    elRechts.classList.add('rein');
    elVs.className = 'vs'; elVs.textContent = 'VS';
    S.zustand = 'frage';
    fokusKnopf();
  }

  function zaehlen(el, ziel, jahr, start) {
    if (ruhig) { el.textContent = zahl(ziel, jahr); return; }
    var von = start || 0, t0 = performance.now(), dauer = 600;
    (function schritt(t) {
      var k = Math.min(1, (t - t0) / dauer);
      el.textContent = zahl(Math.round(von + (ziel - von) * (1 - Math.pow(1 - k, 3))), jahr);
      if (k < 1) requestAnimationFrame(schritt);
    })(t0);
  }

  // ── Effekte ──────────────────────────────────────────────────────────────
  function effekt(klasse) { var el = document.createElement('div'); el.className = klasse; arena.appendChild(el); return el; }
  function weg(el, ms) { setTimeout(function () { el.remove(); }, ms); }
  function plus() {
    var kasten = elSerie.parentNode;
    if (!ruhig) { var p = document.createElement('span'); p.className = 'plus'; p.textContent = '+1'; kasten.appendChild(p); weg(p, 900); }
    kasten.classList.remove('puls'); void kasten.offsetWidth; kasten.classList.add('puls');
    var f = kasten.querySelector('.serie-flamme');
    if (S.serie >= 5 && !f) { f = document.createElement('span'); f.className = 'serie-flamme'; f.textContent = '🔥'; kasten.appendChild(f); }
    if (S.serie < 5 && f) f.remove();
  }
  function funkenAn(el, anzahl) {
    if (ruhig) return;
    var a = arena.getBoundingClientRect(), r = el.getBoundingClientRect();
    var mx = r.left - a.left + r.width / 2, my = r.top - a.top + r.height / 2;
    var farben = ['#f2c230', '#ffffff', '#2fae5b'];
    for (var i = 0; i < anzahl; i++) {
      var f = effekt('funke');
      var w = Math.random() * Math.PI * 2, d = 60 + Math.random() * 80, g = 5 + Math.random() * 6;
      f.style.width = f.style.height = g + 'px';
      f.style.background = farben[i % farben.length];
      f.style.setProperty('--x0', mx + 'px'); f.style.setProperty('--y0', my + 'px');
      f.style.setProperty('--x1', (mx + Math.cos(w) * d) + 'px'); f.style.setProperty('--y1', (my + Math.sin(w) * d) + 'px');
      var dauer = 550 + Math.random() * 350;
      f.style.setProperty('--dauer', dauer + 'ms');
      weg(f, dauer + 50);
    }
  }
  function konfetti(anzahl) {
    if (ruhig) return;
    var b = arena.clientWidth, h = arena.clientHeight;
    var farben = ['#f2c230', '#2f86eb', '#a259e6', '#e5534b', '#ffffff', '#57d37a'];
    for (var i = 0; i < anzahl; i++) {
      var el = effekt('konfetti');
      var x = Math.random() * b, dauer = 1200 + Math.random() * 900, verz = Math.random() * 350;
      el.style.background = farben[i % farben.length];
      el.style.setProperty('--x0', x + 'px'); el.style.setProperty('--y0', '-16px');
      el.style.setProperty('--x1', (x + (Math.random() * 2 - 1) * 70) + 'px'); el.style.setProperty('--y1', (h + 16) + 'px');
      el.style.setProperty('--dreh', ((Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540)) + 'deg');
      el.style.setProperty('--dauer', dauer + 'ms'); el.style.setProperty('--verz', verz + 'ms');
      weg(el, dauer + verz + 50);
    }
  }
  var aktivesBanner = null;
  function banner(text) {
    if (aktivesBanner) aktivesBanner.remove();
    var el = effekt('banner'); el.textContent = text; aktivesBanner = el; weg(el, 1350);
  }

  // ── Eingabe ──────────────────────────────────────────────────────────────
  window.addEventListener('keydown', function (e) {
    if (S.zustand !== 'frage') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); antwort(true); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); antwort(false); }
  });
  elKnopf.addEventListener('click', start);

  bereit();

  // Für Tests: Zustand und Antwort von außen, ohne Einfluss aufs Spiel
  window.__kopf = { S: S, antwort: antwort, start: start, kats: KATS, daten: DATEN };
})();
</script>
