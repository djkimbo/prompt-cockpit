<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Durch die Mauer</title>
<style>
/* Durch die Mauer: Ein-Finger-Geschicklichkeitsspiel. Antippen schießt den Ball nach oben,
   die Schwerkraft holt ihn zurück, durch die Lücken der Verteidiger-Mauern. Gleiche Karte und Farben wie die
   anderen Spiele, eine Datei, keine Netzaufrufe. */
:root {
  --bg: #f2f5f3;
  --card: #ffffff;
  --ink: #17251c;
  --muted: #5b6a61;
  --himmel-1: #1b3a5c;
  --himmel-2: #3f7fb3;
  --pitch: #2f8a4a;
  --pitch-2: #2a7f43;
  --chalk: #ffffff;
  --gold: #f2c230;
  --gegner: #d23c32;
  --gegner-hose: #f7f7f2;
  --haut: #e2b38c;
  --haare: #33251a;
  --ich-hose: #1f5c34;
  --knopf-hover: #e3efe6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  margin: 0;
  font-family: var(--font);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  max-width: 560px;
  margin: 0 auto;
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 1px 3px rgba(23, 37, 28, .06), 0 10px 30px rgba(23, 37, 28, .06);
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1 { font-size: 1.9rem; line-height: 1.15; margin: 0; }
.lead { font-size: 1.08rem; line-height: 1.5; color: var(--muted); margin: 0; }
.game {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: var(--himmel-1);
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.game canvas { display: block; width: 100%; height: 480px; cursor: pointer; touch-action: none; }
.game canvas:focus { outline: none; }
.game canvas:focus-visible { outline: 3px solid var(--chalk); outline-offset: -6px; }
.hud {
  position: absolute; inset: 0 0 auto;
  display: flex; justify-content: space-between; align-items: start;
  padding: 10px 14px;
  color: var(--chalk);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
}
.best { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: right; opacity: .92; }
.best b { display: block; font-size: 1.3rem; letter-spacing: 0; }
.panel {
  position: absolute; left: 50%; top: 55%;
  transform: translate(-50%, -50%);
  width: min(310px, calc(100% - 40px));
  padding: 18px 18px 16px;
  border-radius: 16px;
  background: rgba(12, 32, 19, .86);
  color: var(--chalk);
  text-align: center;
  display: flex; flex-direction: column; gap: 10px;
}
.panel[hidden] { display: none; }
.panel:not([hidden]) { animation: panelAuf 280ms cubic-bezier(.3, 1.4, .5, 1); }
@keyframes panelAuf { from { opacity: 0; transform: translate(-50%, -44%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.panel-titel { margin: 0; font-size: 1.35rem; font-weight: 800; }
.panel.neu .panel-titel { color: var(--gold); }
.panel-text { margin: 0; font-size: .95rem; font-weight: 600; line-height: 1.45; opacity: .93; }
.medaille { font-size: 2.6rem; line-height: 1; margin: 0; }
.medaille[hidden] { display: none; }
.knopf {
  margin-top: 4px;
  appearance: none; border: 0; border-radius: 999px;
  padding: 12px 18px;
  font: inherit; font-size: 1rem; font-weight: 800;
  background: var(--chalk); color: var(--ich-hose);
  cursor: pointer; touch-action: manipulation;
}
.knopf:hover { background: var(--knopf-hover); }
.knopf:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.regeln { margin: 0; padding-left: 1.1em; color: var(--muted); line-height: 1.55; font-size: .95rem; }
.medaille:not([hidden]) { animation: medaille 700ms cubic-bezier(.3, 1.6, .5, 1) 120ms both; }
@keyframes medaille { 0% { scale: 0; rotate: -30deg; } 60% { scale: 1.25; rotate: 8deg; } 100% { scale: 1; rotate: 0deg; } }
.konfetti, .banner { position: absolute; pointer-events: none; z-index: 4; }
.konfetti { left: 0; top: 0; width: 7px; height: 11px; border-radius: 2px; animation: konfetti var(--dauer, 1500ms) cubic-bezier(.25, .6, .4, 1) var(--verz, 0ms) both; }
@keyframes konfetti {
  from { transform: translate(var(--x0), var(--y0)) rotate(0deg); opacity: 1; }
  85% { opacity: 1; }
  to { transform: translate(var(--x1), var(--y1)) rotate(var(--dreh)); opacity: 0; }
}
.banner {
  left: 50%; top: 34%;
  translate: -50% -50%;
  width: max-content; max-width: 86%;
  padding: 10px 18px; border-radius: 14px;
  background: rgba(12, 32, 19, .9); color: var(--chalk);
  font-weight: 900; font-size: 1.2rem; text-align: center; line-height: 1.25;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  animation: banner 1500ms cubic-bezier(.3, 1.4, .5, 1) forwards;
}
.banner small { display: block; font-size: .8rem; font-weight: 800; color: var(--gold); margin-top: 2px; }
.banner.klein { font-size: 1rem; background: var(--gold); color: #17251c; padding: 7px 14px; animation-duration: 1000ms; }
@keyframes banner {
  0% { scale: .5; opacity: 0; }
  14% { scale: 1.08; opacity: 1; }
  24% { scale: 1; }
  78% { opacity: 1; translate: -50% -50%; }
  100% { opacity: 0; translate: -50% -80%; }
}
@media (prefers-reduced-motion: reduce) {
  .panel:not([hidden]), .medaille:not([hidden]) { animation: none; }
  .konfetti { display: none; }
}
</style>
</head>
<body>
<style id="handy">
/* Handy-Grundlage (18.11.2026), gleich in allen Spielen: kein Doppeltipp-Zoom, kein Kontextmenü beim
   langen Drücken, kein Zurückfedern der Seite, kompaktere Karte und Spielfläche passend zur Bildschirmhöhe. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
.game, .arena, .brett, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
@media (max-width: 520px) {
  body { padding-block: 10px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .card { padding: 16px 12px; gap: 12px; border-radius: 16px; }
  h1 { font-size: 1.45rem; }
  .lead { font-size: .95rem; line-height: 1.45; }
  .regeln { font-size: .88rem; }
  .knopf, .wahl { min-height: 44px; }   /* Daumen-Mindestgröße */
  .game canvas { height: clamp(360px, calc(100svh - 190px), 480px); }
}
@media (max-height: 560px) and (orientation: landscape) {
  .lead, .regeln { display: none; }
  body { padding-block: 6px; }
  .card { padding: 10px 12px; gap: 8px; }
  h1 { font-size: 1.2rem; }
  .game canvas { height: clamp(260px, calc(100svh - 70px), 480px); }
}
</style>
<script id="handy-scroll">
// Beim Start auf dem Handy die ganze Spielfläche ins Bild holen
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('.panel .knopf, #neu, .panel button')) return;
  var g = document.querySelector('.game, .arena, .brett');
  if (!g) return;
  var r = g.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) g.scrollIntoView({ block: 'center', behavior: 'smooth' });
}, true);
</script>
<main class="card">
  <h1 id="titel">Durch die Mauer</h1>
  <p class="lead" id="lead"></p>

  <div class="game">
    <canvas id="feld" tabindex="0" aria-label="Durch die Mauer"></canvas>
    <div class="hud">
      <div></div>
      <div class="best" id="best"></div>
    </div>
    <div class="panel" id="panel" aria-live="polite">
      <p class="medaille" id="medaille" hidden></p>
      <p class="panel-titel" id="panelTitel" hidden></p>
      <p class="panel-text" id="panelText"></p>
      <button type="button" class="knopf" id="knopf"></button>
    </div>
  </div>

  <ul class="regeln" id="regeln"></ul>
</main>

<script>
(function () {
  'use strict';

  // ── Texte ────────────────────────────────────────────────────────────────
  var TEXTE = {
    de: {
      lead: 'Ein Finger, ein Ball und eine Mauer nach der anderen. Jeder Tipp schickt den Ball nach oben, die Schwerkraft holt ihn zurück. Hektik bestraft das Spiel sofort, Rhythmus belohnt es.',
      regeln: ['Tippen, klicken, Leertaste oder ↑: der Ball springt nach oben.', 'Durch jede Lücke in der Mauer: 1 Punkt. Goldener Ball in der Lücke: 3 Punkte extra.', 'Eine Berührung mit der Mauer oder dem Rasen beendet den Versuch.', 'Mit jedem Punkt wird es etwas schneller, die Lücken werden enger. Ab 15 Punkten springen die Mauern.', 'Medaillen: Bronze ab 10, Silber ab 25, Gold ab 50, Pokal ab 100.'],
      best: 'Highscore', start: 'Anstoß', hinweis: 'Tippen, um den Ball zu halten.', again: 'Nochmal', ende: 'In der Mauer hängen geblieben!', boden: 'Ball im Rasen versenkt!', rec: 'Neuer Highscore!',
      endeText: '{p} Punkte. {m}', medaillen: ['Noch keine Medaille. Bronze gibt es ab 10.', 'Bronze! Silber gibt es ab 25.', 'Silber! Gold gibt es ab 50.', 'Gold! Der Pokal wartet bei 100.', 'Pokal! Mehr geht kaum.'],
      bonus: 'Traumpass!', springen: 'Die Mauer springt!', schneller: 'Tempo!', perfekt: 'Perfekt!', perfektSerie: '{n}× perfekt hintereinander', rekordLauf: 'Neuer Highscore!', tippen: 'Tippen!',
      medailleBanner: ['', 'Bronze!', 'Silber!', 'Gold!', 'Pokal!']
    },
    en: {
      lead: 'One finger, one ball and one wall after another. Every tap sends the ball up, gravity pulls it back. Panic gets punished right away, rhythm gets rewarded.',
      regeln: ['Tap, click, space or ↑: the ball jumps up.', 'Through every gap in the wall: 1 point. Golden ball in the gap: 3 bonus points.', 'Touching a wall or the grass ends the run.', 'Every point makes it a bit faster and the gaps tighter. From 15 points the walls start jumping.', 'Medals: bronze from 10, silver from 25, gold from 50, trophy from 100.'],
      best: 'High score', start: 'Kick off', hinweis: 'Tap to keep the ball up.', again: 'Play again', ende: 'Stuck in the wall!', boden: 'Ball buried in the grass!', rec: 'New high score!',
      endeText: '{p} points. {m}', medaillen: ['No medal yet. Bronze from 10.', 'Bronze! Silver from 25.', 'Silver! Gold from 50.', 'Gold! The trophy waits at 100.', 'Trophy! Hard to beat.'],
      bonus: 'Dream pass!', springen: 'The wall is jumping!', schneller: 'Speed up!', perfekt: 'Perfect!', perfektSerie: '{n} perfect in a row', rekordLauf: 'New high score!', tippen: 'Tap!',
      medailleBanner: ['', 'Bronze!', 'Silver!', 'Gold!', 'Trophy!']
    }
  };
  var sprache = ((navigator.languages && navigator.languages[0]) || navigator.language || 'de').slice(0, 2).toLowerCase();
  var L = TEXTE[sprache] ? sprache : 'en';
  var T = TEXTE[L];
  document.documentElement.lang = L;
  var FORMAT = null;
  try { FORMAT = new Intl.NumberFormat(L); } catch (e) { FORMAT = null; }
  function zahl(n) { n = Math.floor(n); return FORMAT ? FORMAT.format(n) : String(n); }

  function $(id) { return document.getElementById(id); }
  var cv = $('feld'), ctx = cv.getContext('2d');
  var elBest = $('best'), elPanel = $('panel'), elTitel = $('panelTitel'), elText = $('panelText'), elKnopf = $('knopf'), elMedaille = $('medaille');
  $('lead').textContent = T.lead;
  T.regeln.forEach(function (r) { var li = document.createElement('li'); li.textContent = r; $('regeln').appendChild(li); });

  var css = getComputedStyle(document.documentElement);
  function farbe(n) { return css.getPropertyValue(n).trim(); }
  var C = {
    h1: farbe('--himmel-1'), h2: farbe('--himmel-2'), pitch: farbe('--pitch'), pitch2: farbe('--pitch-2'), chalk: farbe('--chalk'),
    gold: farbe('--gold'), gegner: farbe('--gegner'), gegnerHose: farbe('--gegner-hose'), haut: farbe('--haut'), haare: farbe('--haare'), ink: '#1b2420'
  };
  var FONT = farbe('--font');
  var ruhig = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ── Regeln als Zahlen (px, Sekunden) ─────────────────────────────────────
  var SCHWERKRAFT = 1500, SPRUNG = -440, MAX_FALL = 640;
  var BALL_R = 13, TREFFER_R = 10.5;          // Trefferkreis etwas kleiner als der Ball: fairer
  var BODEN = 46;                             // Rasenstreifen unten
  var MAUER_B = 56;
  var ABSTAND = 250;                          // Abstand zwischen Mauern (px)
  var TEMPO_START = 160, TEMPO_PRO_PUNKT = 2, TEMPO_MAX = 290;
  var LUECKE_START = 170, LUECKE_PRO_PUNKT = 1.2, LUECKE_MIN = 126;
  var SPRINGEN_AB = 15;                       // ab hier bewegen sich die Lücken
  var BONUS_CHANCE = 0.22, BONUS_PUNKTE = 3;
  var MEDAILLEN = [10, 25, 50, 100];
  var SPEICHER = 'prompt_cockpit_mauer_highscore';

  var W = 0, H = 0, dpr = 1;
  function groesse() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function klemm(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function zufall(a, b) { return a + Math.random() * (b - a); }

  // ── Zustand ──────────────────────────────────────────────────────────────
  var rekord = 0;
  try { rekord = parseInt(localStorage.getItem(SPEICHER), 10) || 0; } catch (e) { rekord = 0; }
  var S = null;
  var funken = [], texte = [], spur = [];

  function neu(zustand) {
    S = {
      zustand: zustand,       // bereit | spiel | aus | ende
      zeit: 0, punkte: 0,
      ball: { x: 0, y: 0, vy: 0, dreh: 0, quetsch: 0 },
      mauern: [], naechsteIn: 0, letzteMitte: 0,
      scroll: 0, wackeln: 0, blitz: 0, ausSeit: 0, ursache: '',
      punktPop: 0, perfektSerie: 0, rekordGefeiert: rekord === 0, ola: -1, kickZeit: 9
    };
    S.ball.x = Math.round(W * 0.28);
    S.ball.y = (H - BODEN) * 0.45;
    S.letzteMitte = (H - BODEN) / 2;
    S.naechsteIn = 0.9;
    funken = []; texte = []; spur = [];
  }

  function tempo() { return Math.min(TEMPO_MAX, TEMPO_START + S.punkte * TEMPO_PRO_PUNKT); }
  function luecke() { return Math.max(LUECKE_MIN, LUECKE_START - S.punkte * LUECKE_PRO_PUNKT); }

  function neueMauer() {
    var l = luecke(), oben = 70 + l / 2, unten = H - BODEN - 40 - l / 2;
    // höchstens 145 px Sprung zur letzten Lücke, damit jede Lücke erreichbar bleibt
    var mitte = klemm(S.letzteMitte + zufall(-145, 145), oben, unten);
    S.letzteMitte = mitte;
    var spring = S.punkte >= SPRINGEN_AB ? Math.min(34, 8 + (S.punkte - SPRINGEN_AB) * 0.8) : 0;
    S.mauern.push({
      x: W + MAUER_B, mitte: mitte, basis: mitte, l: l, gezaehlt: false,
      spring: spring, phase: Math.random() * Math.PI * 2, takt: zufall(1.6, 2.4),
      bonus: Math.random() < BONUS_CHANCE ? { geholt: false } : null,
      arme: Math.random() * 6
    });
  }

  // ── Tafel ────────────────────────────────────────────────────────────────
  function tafel(titel, text, knopf, neuRekord, medaille) {
    elTitel.hidden = !titel; elTitel.textContent = titel || '';
    elText.textContent = text;
    elKnopf.textContent = knopf;
    elMedaille.hidden = !medaille; elMedaille.textContent = medaille || '';
    elPanel.classList.toggle('neu', !!neuRekord);
    elPanel.hidden = false;
    try { elKnopf.focus({ preventScroll: true }); } catch (e) { /* egal */ }
  }
  function hud() {
    elBest.textContent = '';
    elBest.appendChild(document.createTextNode(T.best));
    var b = document.createElement('b'); b.textContent = zahl(Math.max(rekord, S.punkte)); elBest.appendChild(b);
  }

  function bereit() {
    neu('bereit');
    tafel('', T.hinweis, T.start, false, '');
    hud();
  }
  function start() {
    neu('spiel');
    elPanel.hidden = true;
    try { cv.focus({ preventScroll: true }); } catch (e) { /* egal */ }
    hud();
    kick();
  }
  function medaille(p) {
    var i = 0; while (i < MEDAILLEN.length && p >= MEDAILLEN[i]) i++;
    return i;
  }
  function aus(ursache) {
    if (S.zustand !== 'spiel') return;
    S.zustand = 'aus';
    S.ausSeit = 0;
    S.ursache = ursache;
    S.wackeln = 0.35; S.blitz = 0.25;
    S.ball.vy = Math.min(S.ball.vy, -180);
    explosion(S.ball.x, S.ball.y, 26, [C.chalk, C.gegner, C.gold]);
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* egal */ } }
  }
  function ende() {
    S.zustand = 'ende';
    var neuR = S.punkte > rekord;
    if (neuR) { rekord = S.punkte; try { localStorage.setItem(SPEICHER, String(rekord)); } catch (e) { /* egal */ } konfetti(70); }
    var m = medaille(S.punkte);
    tafel(neuR ? T.rec : (S.ursache === 'boden' ? T.boden : T.ende), T.endeText.replace('{p}', zahl(S.punkte)).replace('{m}', T.medaillen[m]), T.again, neuR, ['', '🥉', '🥈', '🥇', '🏆'][m]);
    hud();
  }

  // ── Eingabe ──────────────────────────────────────────────────────────────
  function kick() {
    if (S.zustand !== 'spiel') return;
    S.ball.vy = SPRUNG;
    S.ball.quetsch = 1;
    S.kickZeit = 0;
    // Rasen-/Staubwölkchen unter dem Ball
    if (!ruhig) for (var i = 0; i < 5; i++) funken.push({ x: S.ball.x - 4, y: S.ball.y + BALL_R, vx: zufall(-80, -20), vy: zufall(40, 120), t: 0, d: 0.35, r: zufall(1.5, 3), f: 'rgba(255,255,255,0.7)' });
  }
  function eingabe() {
    if (!elPanel.hidden) return;
    if (S.zustand === 'spiel') kick();
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); eingabe(); });
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      if (!elPanel.hidden) return;   // Leertaste auf dem Knopf startet über den Knopf
      e.preventDefault();
      if (!e.repeat) eingabe();
    }
  });
  elKnopf.addEventListener('click', start);

  // ── Effekte ──────────────────────────────────────────────────────────────
  function explosion(x, y, n, farben) {
    if (ruhig) return;
    for (var i = 0; i < n; i++) {
      var w = Math.random() * Math.PI * 2, v = zufall(80, 320);
      funken.push({ x: x, y: y, vx: Math.cos(w) * v, vy: Math.sin(w) * v - 60, t: 0, d: zufall(0.4, 0.8), r: zufall(2, 4.5), f: farben[i % farben.length], g: true });
    }
  }
  function text(txt, x, y, f, gross) { texte.push({ txt: txt, x: x, y: y, t: 0, d: 0.9, f: f, gross: gross }); }
  var spielfeld = cv.parentNode;
  function weg(el, ms) { setTimeout(function () { el.remove(); }, ms); }
  var aktivesBanner = null;
  function banner(txt, unter, klein) {
    if (aktivesBanner) aktivesBanner.remove();
    var el = document.createElement('div');
    el.className = 'banner' + (klein ? ' klein' : '');
    el.textContent = txt;
    if (unter) { var u = document.createElement('small'); u.textContent = unter; el.appendChild(u); }
    spielfeld.appendChild(el);
    aktivesBanner = el;
    weg(el, klein ? 1050 : 1550);
  }
  function konfetti(anzahl) {
    if (ruhig) return;
    var farben = ['#f2c230', '#2f86eb', '#a259e6', '#e5534b', '#ffffff', '#57d37a'];
    for (var i = 0; i < anzahl; i++) {
      var el = document.createElement('div');
      el.className = 'konfetti';
      var x = Math.random() * W, dauer = 1200 + Math.random() * 900, verz = Math.random() * 350;
      el.style.background = farben[i % farben.length];
      el.style.setProperty('--x0', x + 'px'); el.style.setProperty('--y0', '-16px');
      el.style.setProperty('--x1', (x + (Math.random() * 2 - 1) * 70) + 'px'); el.style.setProperty('--y1', (H + 16) + 'px');
      el.style.setProperty('--dreh', ((Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540)) + 'deg');
      el.style.setProperty('--dauer', dauer + 'ms'); el.style.setProperty('--verz', verz + 'ms');
      spielfeld.appendChild(el);
      weg(el, dauer + verz + 50);
    }
  }
  function ola() { if (!ruhig) S.ola = 0; }   // Welle läuft einmal durch die Tribüne

  // ── Ablauf ───────────────────────────────────────────────────────────────
  function schritt(dt) {
    var b = S.ball;
    S.wackeln = Math.max(0, S.wackeln - dt);
    S.blitz = Math.max(0, S.blitz - dt);
    b.quetsch = Math.max(0, b.quetsch - dt * 6);
    S.punktPop = Math.max(0, S.punktPop - dt * 4);
    S.kickZeit += dt;
    if (S.ola >= 0) { S.ola += dt * 520; if (S.ola > W + 200) S.ola = -1; }

    if (S.zustand === 'bereit') {
      S.zeit += dt;
      b.y = (H - BODEN) * 0.45 + Math.sin(S.zeit * 3) * 10;
      b.dreh += dt * 2;
      S.scroll += 60 * dt;
    } else if (S.zustand === 'spiel' || S.zustand === 'aus') {
      S.zeit += dt;
      b.vy = Math.min(MAX_FALL, b.vy + SCHWERKRAFT * dt);
      b.y += b.vy * dt;
      b.dreh += (S.zustand === 'spiel' ? tempo() : 60) * dt / BALL_R;
      if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.max(b.vy, 0); }
    }

    if (S.zustand === 'spiel') {
      var v = tempo();
      S.scroll += v * dt;
      S.naechsteIn -= dt;
      if (S.naechsteIn <= 0) { neueMauer(); S.naechsteIn = ABSTAND / v; }

      for (var i = S.mauern.length - 1; i >= 0; i--) {
        var m = S.mauern[i];
        m.x -= v * dt;
        m.arme += dt * (Math.abs(m.x + MAUER_B / 2 - b.x) < 110 ? 16 : 6);
        if (m.spring) m.mitte = klemm(m.basis + Math.sin(S.zeit * m.takt + m.phase) * m.spring, 60 + m.l / 2, H - BODEN - 30 - m.l / 2);
        // Kollision: Kreis gegen die beiden Rechtecke der Mauer
        if (treffer(b, m)) { aus('mauer'); break; }
        // Bonus in der Lücke
        if (m.bonus && !m.bonus.geholt && Math.hypot(m.x + MAUER_B / 2 - b.x, m.mitte - b.y) < BALL_R + 11) {
          m.bonus.geholt = true;
          S.punkte += BONUS_PUNKTE;
          S.punktPop = 1.3;
          meilensteine(S.punkte - BONUS_PUNKTE);
          text('+' + BONUS_PUNKTE + ' ' + T.bonus, b.x + 30, b.y - 24, C.gold, false);
          explosion(m.x + MAUER_B / 2, m.mitte, 16, [C.gold, C.chalk]);
          hud();
        }
        // Punkt beim Passieren
        if (!m.gezaehlt && m.x + MAUER_B < b.x - BALL_R) {
          m.gezaehlt = true;
          S.punkte += 1;
          S.punktPop = 1;
          hud();
          if (!ruhig) spur.push({ x: b.x, y: b.y, t: 0 });
          // durch die Mitte der Lücke: Perfekt
          if (Math.abs(b.y - m.mitte) < 14) {
            S.perfektSerie++;
            text(T.perfekt, b.x + 34, b.y - 18, C.gold, false);
            explosion(b.x, b.y, 10, [C.gold, C.chalk]);
            if (S.perfektSerie >= 3) banner(T.perfektSerie.replace('{n}', S.perfektSerie), '', true);
          } else {
            S.perfektSerie = 0;
          }
          meilensteine(S.punkte - 1);
        }
        if (m.x < -MAUER_B - 20) S.mauern.splice(i, 1);
      }
      if (S.zustand === 'spiel' && b.y + TREFFER_R >= H - BODEN) { b.y = H - BODEN - TREFFER_R; aus('boden'); }
    } else if (S.zustand === 'aus') {
      S.ausSeit += dt;
      if (b.y + BALL_R >= H - BODEN) { b.y = H - BODEN - BALL_R; b.vy = -b.vy * 0.35; if (Math.abs(b.vy) < 40) b.vy = 0; }
      if (S.ausSeit > 0.85) ende();
    }

    for (var f = funken.length - 1; f >= 0; f--) {
      var p = funken[f]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += 600 * dt;
      if (p.t > p.d) funken.splice(f, 1);
    }
    for (var n = texte.length - 1; n >= 0; n--) { texte[n].t += dt; if (texte[n].t > texte[n].d) texte.splice(n, 1); }
    for (var s = spur.length - 1; s >= 0; s--) { spur[s].t += dt; if (spur[s].t > 0.4) spur.splice(s, 1); }
  }

  // Feiern, was zwischen altem und neuem Punktestand überschritten wurde (auch per Bonus übersprungen)
  function meilensteine(vorher) {
    var p = S.punkte, mi = medaille(p) - 1;
    if (medaille(vorher) < medaille(p)) {
      banner(['🥉', '🥈', '🥇', '🏆'][mi] + ' ' + T.medailleBanner[mi + 1], '', false);
      konfetti(40 + mi * 25); ola();
      explosion(W / 2, 70, 30, [C.gold, C.chalk, '#2f86eb']);
    } else if (vorher < SPRINGEN_AB && p >= SPRINGEN_AB) { text(T.springen, W / 2, 96, C.gold, true); ola(); }
    else if (Math.floor(vorher / 10) < Math.floor(p / 10)) { text(T.schneller, W / 2, 96, C.chalk, true); ola(); }
    if (!S.rekordGefeiert && p > rekord) {
      S.rekordGefeiert = true;
      banner('⭐ ' + T.rekordLauf, '', true);
      konfetti(30);
    }
  }

  function treffer(b, m) {
    var r = TREFFER_R;
    var oben = m.mitte - m.l / 2, unten = m.mitte + m.l / 2;
    return kreisRechteck(b.x, b.y, r, m.x, 0, MAUER_B, oben) || kreisRechteck(b.x, b.y, r, m.x, unten, MAUER_B, H - BODEN - unten);
  }
  function kreisRechteck(cx, cy, r, x, y, w, h) {
    var nx = klemm(cx, x, x + w), ny = klemm(cy, y, y + h);
    return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
  }

  // ── Zeichnen ─────────────────────────────────────────────────────────────
  function himmel() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C.h1); g.addColorStop(1, C.h2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // Flutlichter (weit hinten, langsam)
    var off = (S.scroll * 0.1) % 260;
    for (var x = -off; x < W + 40; x += 260) {
      if (Math.abs(x + 23 - W / 2) < 70) continue;   // nicht hinter der Punktzahl
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x + 20, 18, 5, H);
      ctx.fillStyle = 'rgba(255,248,220,0.85)';
      ctx.fillRect(x + 6, 8, 34, 12);
      var lg = ctx.createRadialGradient(x + 23, 14, 2, x + 23, 14, 70);
      lg.addColorStop(0, 'rgba(255,248,220,0.35)'); lg.addColorStop(1, 'rgba(255,248,220,0)');
      ctx.fillStyle = lg; ctx.fillRect(x - 50, -30, 150, 140);
    }
    // Tribüne mit Zuschauer-Punkten (mittlere Ebene)
    var tY = H - BODEN - 70;
    ctx.fillStyle = 'rgba(10,25,40,0.55)';
    ctx.fillRect(0, tY, W, 70);
    var off2 = (S.scroll * 0.3) % 14;
    for (var r = 0; r < 4; r++) {
      for (var px = -off2 + (r % 2) * 7; px < W; px += 14) {
        var hue = (Math.floor((px + S.scroll * 0.3) / 14) * 47 + r * 13) % 360;
        var welle = S.ola >= 0 ? Math.exp(-Math.pow((px - S.ola) / 45, 2)) : 0;
        ctx.fillStyle = 'hsla(' + hue + ',55%,' + (65 + welle * 20) + '%,' + (0.55 + welle * 0.4) + ')';
        ctx.beginPath(); ctx.arc(px, tY + 12 + r * 15 - welle * 10, 3.2 + welle, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function rasen() {
    var y = H - BODEN;
    ctx.fillStyle = C.pitch; ctx.fillRect(0, y, W, BODEN);
    var off = S.scroll % 40;
    ctx.fillStyle = C.pitch2;
    for (var x = -off; x < W; x += 40) ctx.fillRect(x, y, 20, BODEN);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, y, W, 3);
  }

  // Ein Verteidiger von vorn, Mitte (x, y), Höhe ~ 34 px
  function verteidiger(x, y, arm, kopfUnten) {
    ctx.save();
    ctx.translate(x, y);
    if (kopfUnten) ctx.scale(1, -1);
    ctx.fillStyle = C.gegnerHose; ctx.fillRect(-9, 6, 18, 7);                       // Hose
    ctx.fillStyle = C.ink; ctx.fillRect(-8, 13, 6, 4); ctx.fillRect(2, 13, 6, 4);     // Schuhe
    ctx.fillStyle = C.gegner;                                                          // Trikot
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-11, -8, 22, 15, 4); else ctx.rect(-11, -8, 22, 15); ctx.fill();
    ctx.strokeStyle = C.gegner; ctx.lineWidth = 4; ctx.lineCap = 'round';           // Arme, wedelnd
    var a = Math.sin(arm) * 5, hoch = (S.zustand === 'aus' || S.zustand === 'ende') ? -10 : 0;
    ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(-17, -14 + a + hoch); ctx.moveTo(10, -5); ctx.lineTo(17, -14 - a + hoch); ctx.stroke();
    ctx.fillStyle = C.haut; ctx.beginPath(); ctx.arc(0, -13, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.haare; ctx.beginPath(); ctx.arc(0, -15, 6, Math.PI, 0); ctx.fill();
    ctx.restore();
  }
  function mauer(m) {
    var oben = m.mitte - m.l / 2, unten = m.mitte + m.l / 2, cx = m.x + MAUER_B / 2;
    // Latte oben, an der die obere Mauer hängt
    ctx.fillStyle = 'rgba(12,32,19,0.72)';
    ctx.fillRect(m.x - 4, 0, MAUER_B + 8, oben);
    ctx.fillRect(m.x - 4, unten, MAUER_B + 8, H - BODEN - unten);
    // obere Mauer: Verteidiger hängen kopfüber, Reihe für Reihe
    var reihe = 30;
    for (var y = oben - 16, i = 0; y > -reihe; y -= reihe, i++) verteidiger(cx, y, m.arme + i, true);
    // untere Mauer: Verteidiger stehen aufeinander
    for (var y2 = unten + 18, j = 0; y2 < H - BODEN + reihe; y2 += reihe, j++) verteidiger(cx, y2, m.arme + j + 1, false);
    // Kanten der Lücke
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(m.x - 4, oben - 3, MAUER_B + 8, 3);
    ctx.fillRect(m.x - 4, unten, MAUER_B + 8, 3);
    // Bonus-Ball
    if (m.bonus && !m.bonus.geholt) {
      var pul = 1 + Math.sin(S.zeit * 6) * 0.08;
      ctx.save(); ctx.translate(cx, m.mitte); ctx.scale(pul, pul);
      ctx.shadowColor = C.gold; ctx.shadowBlur = 14;
      ball(0, 0, 9, S.zeit * 2, C.gold);
      ctx.restore();
    }
  }
  function ball(x, y, r, dreh, grund) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(dreh);
    ctx.fillStyle = grund || C.chalk;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.beginPath();
    for (var i = 0; i < 5; i++) { var a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38); }
    ctx.closePath(); ctx.fill();
    for (var j = 0; j < 5; j++) { var a2 = -Math.PI / 2 + j * 2 * Math.PI / 5; ctx.beginPath(); ctx.arc(Math.cos(a2) * r * 0.95, Math.sin(a2) * r * 0.95, r * 0.27, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function spieler() {
    var b = S.ball;
    // Schweif
    if (!ruhig && S.zustand === 'spiel') {
      for (var k = 1; k <= 5; k++) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.12 - k * 0.02) + ')';
        ctx.beginPath(); ctx.arc(b.x - k * 7, b.y - b.vy * 0.012 * k, BALL_R * (1 - k * 0.1), 0, Math.PI * 2); ctx.fill();
      }
    }
    // Wischer unter dem Ball direkt nach dem Kick
    if (!ruhig && S.kickZeit < 0.16) {
      var k2 = 1 - S.kickZeit / 0.16;
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.7 * k2 + ')'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (var w2 = -1; w2 <= 1; w2++) {
        ctx.beginPath(); ctx.moveTo(b.x + w2 * 8, b.y + BALL_R + 4 + S.kickZeit * 40); ctx.lineTo(b.x + w2 * 11, b.y + BALL_R + 12 + S.kickZeit * 70); ctx.stroke();
      }
    }
    // Tipp-Hinweis vor dem Start
    if (S.zustand === 'bereit') {
      var puls = 1 + Math.sin(S.zeit * 6) * 0.12;
      ctx.save(); ctx.translate(b.x + 46, b.y + 4); ctx.scale(puls, puls);
      ctx.font = '26px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('👆', 0, 9);
      ctx.restore();
      ctx.font = '800 14px ' + FONT; ctx.fillStyle = C.chalk; ctx.textAlign = 'left'; ctx.fillText(T.tippen, b.x + 64, b.y + 8);
    }
    // Schatten auf dem Rasen
    var hoehe = (H - BODEN) - b.y;
    ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0.05, 0.3 - hoehe / 1200) + ')';
    ctx.beginPath(); ctx.ellipse(b.x, H - BODEN + 6, BALL_R * Math.max(0.4, 1 - hoehe / 500), 4, 0, 0, Math.PI * 2); ctx.fill();
    // Ball mit Quetschen beim Kick
    ctx.save();
    ctx.translate(b.x, b.y);
    var q = b.quetsch * 0.22, neig = klemm(b.vy / 900, -0.5, 0.6);
    ctx.rotate(neig); ctx.scale(1 + q, 1 - q); ctx.rotate(-neig);
    ball(0, 0, BALL_R, b.dreh);
    ctx.restore();
  }

  function zeichnen() {
    ctx.save();
    if (S.wackeln > 0 && !ruhig) ctx.translate(zufall(-4, 4) * S.wackeln * 3, zufall(-4, 4) * S.wackeln * 3);
    himmel();
    // Tempo-Streifen, sobald es schnell wird
    if (!ruhig && S.zustand === 'spiel' && tempo() > 210) {
      var st = (tempo() - 210) / 80;
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.10 * st + ')'; ctx.lineWidth = 2;
      for (var z = 0; z < 7; z++) {
        var zy = (z * 67 + 23) % (H - BODEN - 80) + 40, zx = W - ((S.scroll * 1.6 + z * 137) % (W + 120));
        ctx.beginPath(); ctx.moveTo(zx, zy); ctx.lineTo(zx + 40 + st * 30, zy); ctx.stroke();
      }
    }
    for (var i = 0; i < S.mauern.length; i++) mauer(S.mauern[i]);
    rasen();
    for (var s = 0; s < spur.length; s++) {
      var sp = spur[s];
      ctx.strokeStyle = 'rgba(242,194,48,' + (1 - sp.t / 0.4) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, BALL_R + 4 + sp.t * 50, 0, Math.PI * 2); ctx.stroke();
    }
    spieler();
    for (var f = 0; f < funken.length; f++) {
      var p = funken[f]; ctx.globalAlpha = 1 - p.t / p.d; ctx.fillStyle = p.f;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Punkte groß oben mittig
    if (S.zustand !== 'bereit') {
      ctx.save();
      ctx.translate(W / 2, 46);
      var pop = 1 + (ruhig ? 0 : S.punktPop * 0.35);
      ctx.scale(pop, pop);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 46px ' + FONT;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillText(zahl(S.punkte), 2, 2);
      ctx.fillStyle = S.punktPop > 0.6 ? C.gold : C.chalk; ctx.fillText(zahl(S.punkte), 0, 0);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    ctx.textAlign = 'center';
    for (var n = 0; n < texte.length; n++) {
      var t = texte[n], a = t.t / t.d;
      ctx.globalAlpha = a < 0.7 ? 1 : 1 - (a - 0.7) / 0.3;
      ctx.font = (t.gross ? '900 24px ' : '800 15px ') + FONT;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillText(t.txt, t.x + 1, t.y - t.t * 24 + 2);
      ctx.fillStyle = t.f; ctx.fillText(t.txt, t.x, t.y - t.t * 24);
    }
    ctx.globalAlpha = 1;
    if (S.blitz > 0 && !ruhig) { ctx.fillStyle = 'rgba(255,255,255,' + S.blitz * 1.6 + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  var zuletzt = performance.now();
  function schleife(jetzt) {
    var dt = Math.min(0.033, (jetzt - zuletzt) / 1000);
    zuletzt = jetzt;
    schritt(dt);
    zeichnen();
    requestAnimationFrame(schleife);
  }

  window.addEventListener('resize', function () { var vorher = W; groesse(); if (S && S.zustand === 'bereit' && vorher !== W) S.ball.x = Math.round(W * 0.28); });
  groesse();
  bereit();
  requestAnimationFrame(schleife);

  // Für Tests: Zustand, Schritt und Eingabe von außen, ohne Einfluss aufs Spiel
  window.__mauer = { S: function () { return S; }, schritt: schritt, zeichnen: zeichnen, start: start, kick: kick, luecke: luecke, tempo: tempo, H: function () { return H; }, BODEN: BODEN, MAUER_B: MAUER_B };
})();
</script>
</body>
</html>
